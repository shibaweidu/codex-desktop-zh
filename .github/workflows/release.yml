name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (for example v0.8.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - run: .\build.ps1 -Configuration Release
        shell: powershell
      - name: Test and verify version
        shell: powershell
        run: |
          $exe = '.\dist\Codex-Zh-Launcher-Windows-x64.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput self-test.out
          if ($process.ExitCode -ne 0) { throw "Self-test failed: $($process.ExitCode)" }
          .\test-shutdown.ps1
          .\test-workspace.ps1
          $tag = '${{ inputs.release_tag || github.ref_name }}'
          $expected = $tag.TrimStart('v') + '.0'
          $actual = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe)).FileVersion
          if ($actual -ne $expected) { throw "Tag does not match executable version $actual." }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/Codex-Zh-Launcher-Windows-x64.exe

  theme-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/theme-script.test.cjs
      - run: node tests/localization-script.test.cjs

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            asset: Codex-Zh-Launcher-macOS-arm64.zip
          - arch: x86_64
            runner: macos-15-intel
            asset: Codex-Zh-Launcher-macOS-x64.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - run: bash scripts/test-macos.sh
      - run: CODEX_ZH_SHARED_DIR="$PWD/shared" swift run --package-path macos CodexZhLauncherMac --self-test
      - name: Run CLI diagnostics on host
        run: |
          set +e
          CODEX_ZH_SHARED_DIR="$PWD/shared" swift run --package-path macos CodexZhLauncherMac --diagnostics | tee diagnostics.out
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          grep -Eq 'codex=(found|not-found)' diagnostics.out
      - run: bash scripts/build-macos.sh '${{ matrix.arch }}'
      - name: Run updater integration test on host architecture
        run: bash scripts/test-macos-updater.sh '${{ matrix.arch }}'
      - name: Verify tag version
        run: |
          release_tag='${{ inputs.release_tag || github.ref_name }}'
          expected="${release_tag#v}"
          actual="$(unzip -p "dist/${{ matrix.asset }}" '*/Contents/Info.plist' | plutil -extract CFBundleShortVersionString raw -o - -)"
          test "$actual" = "$expected"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: [windows, macos, theme-fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum Codex-Zh-Launcher-Windows-x64.exe Codex-Zh-Launcher-macOS-arm64.zip Codex-Zh-Launcher-macOS-x64.zip > SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag='${{ inputs.release_tag || github.ref_name }}'
          notes_file="docs/releases/$release_tag.md"
          if [ -f "$notes_file" ]; then
            gh release create "$release_tag" release-assets/* --repo '${{ github.repository }}' --title "Codex 汉化增强工具 $release_tag" --notes-file "$notes_file" --verify-tag
          else
            gh release create "$release_tag" release-assets/* --repo '${{ github.repository }}' --title "Codex 汉化增强工具 $release_tag" --generate-notes --verify-tag
          fi
